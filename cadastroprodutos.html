        <!-- Administradores -->
        <div class="accordion">
          <div class="flex-menu-aside accordion-header active">

          </div>

    </aside>



    <section class="aside-direito">


      <header id="menu">
        <div class="flex-ok">
          <button class="menu-toggle" type="button" aria-label="Abrir menu" aria-controls="menu-lateral" aria-expanded="false"><i class="ti ti-menu-2" aria-hidden="true"></i></button>
          <h3 id="nome-usuario">
            Bem-vindo, <strong>Administrador</strong>

        </div>
        <div class="flex" style="align-items: center; gap: 20px;">


          <a href="src/php/logout.php" class="logout-btn">
            <i class="ti ti-logout"></i>
            <span>Sair</span>
          </a>

        </div>
      </header>


      <main class="conteudo">
        <div class="produto-search">
          <h1 class="title-produtos">Cadastro de Produtos</h1>
        </div>

        <div
          style="background-color: var(--card-bg); padding: 24px; border-radius: var(--border-radius-lg); box-shadow: var(--shadow-md); border: 1px solid var(--border-color);">

          <form id="form-produto" action="src/php/cadastrar_produto.php" method="POST" enctype="multipart/form-data"
            class="conteudo-cadastro-produtos">
            <article class="form-left">
              <div class="input-group">
                <label for="nome">Nome do Produto</label>
                <div class="search-container" style="width: 100%">

                  <input type="text" name="nome" id="nome" class="search-input" placeholder="Digite o nome do produto"
                    required>
                </div>
              </div>

              <div class="input-group">
                <label for="preco">Preço</label>
                <div class="search-container" style="width: 100%">

                  <input type="number" step="0.01" min="0" name="preco" id="preco" class="search-input"
                    placeholder="Digite o valor do produto" required>
                </div>
              </div>

              <div class="input-group">
                <label for="categoria-options">Categoria</label>
                <div class="search-container" style="width: 100%">

                  <select name="categoria_id" id="categoria-options" class="search-input" required>
                    <option value="">Escolha a Categoria</option>
                  </select>
                </div>
              </div>

              <div class="input-group">
                <label for="quantidade">Quantidade</label>
                <div class="search-container" style="width: 100%">

                  <input type="number" min="0" step="1" name="quantidade" id="quantidade" class="search-input"
                    placeholder="Digite a quantidade disponível" required>
                </div>
              </div>

              <div class="input-group">
                <label for="descricao">Descrição</label>
                <div class="search-container" style="width: 100%">
                  <textarea name="descricao" id="descricao" class="search-input input-descricao"
                    placeholder="Digite uma descrição para o produto" required></textarea>
                </div>
              </div>

              <div class="buttons-container">
                <button type="submit" class="btn-quick-primary">
                  <i class="ti ti-device-floppy"></i>
                  <span>Cadastrar</span>
                </button>
                <button type="button" class="btn-quick-secondary" onclick="limparFormulario()">
                  <i class="ti ti-trash"></i>
                  <span>Limpar</span>
                </button>
              </div>
            </article>

            <article class="form-right">
              <div id="preview" class="image-preview-container">
                <i class="ti ti-photo-plus" style="font-size: 48px; color: var(--text-secondary);"></i>
                <span>Nenhuma imagem selecionada</span>
              </div>

              <div class="file-upload-container">
                <label for="imagemInput" class="file-upload-label">
                  <i class="ti ti-upload"></i>
                  <span>Selecionar Imagem</span>
                </label>
                <input type="file" id="imagemInput" name="imagem" accept="image/*" class="filereader" required>
              </div>
            </article>
          </form>
        </div>
      </main>
    </section>
  </div>

  <script src="src/javascript/limparformulario.js"></script>
