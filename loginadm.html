<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar | ClassKey</title>
  <link rel="stylesheet" href="src/css/login.css">
  <link rel="icon" href="src/images/logo-principal.png">
  <script src="src/javascript/login.js" defer></script>
</head>
<body>
  <div class="fundoAnimado" aria-hidden="true"><div class="bolha"></div><div class="bolha"></div><div class="bolha"></div><div class="bolha"></div><div class="bolha"></div></div>
  <main class="containerLogin">
    <div class="cartaoLogin">
      <div class="cabecalhoLogin">
        <img src="src/images/logo-principal.png" alt="ClassKey" width="64">
        <h1 class="tituloLogin">ClassKey</h1>
        <p class="subTituloLogin">Painel administrativo do catálogo de jogos.</p>
      </div>
      <form id="formularioLogin" class="formularioLogin">
        <div class="campoFormulario">
          <label for="email-admin">E-mail</label>
          <input type="email" id="email-admin" name="email-admin" placeholder="seu@email.com" autocomplete="username" required>
        </div>
        <div class="campoFormulario">
          <label for="senha-admin">Senha</label>
          <input type="password" id="senha-admin" name="senha-admin" placeholder="Digite sua senha" autocomplete="current-password" required>
        </div>
        <p id="mensagem-erro" role="alert" hidden></p>
        <button type="submit" class="botaoEntrar">Entrar</button>
      </form>
      <div class="rodapeLogin"><p>ClassKey · Painel administrativo</p></div>
      <noscript>Ative o JavaScript no navegador para entrar no painel.</noscript>
    </div>
  </main>
</body>
</html>
